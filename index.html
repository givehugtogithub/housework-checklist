<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>家事打卡表</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <h1>家事打卡表</h1>
  <div id="month-switcher">
    <button id="prev-month" type="button" aria-label="上一個月">‹</button>
    <span id="month-label"></span>
    <button id="next-month" type="button" aria-label="下一個月">›</button>
  </div>
  <div id="color-picker"></div>
  <div class="grid-wrapper">
    <table id="grid">
      <thead><tr></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <p id="tally" class="tally"></p>
  <script type="module" src="src/app.js"></script>
</body>
</html>
